<script>
    // 🔒 1. ระบุอีเมลของคุณที่จะได้รับสิทธิ์ Admin แค่อีเมลเดียวเท่านั้น
    const ADMIN_EMAIL = "6807545@kjst.ac.th"; 

    // Initial Seed Data
    const defaultUsers = [
      { email: ADMIN_EMAIL, pass: '1234', name: 'เจ้าของเว็บ (Admin)', role: 'admin', status: 'approved' }
    ];

    const defaultLogs = [
      { id: 1, subject: 'คณิตศาสตร์', topic: 'สมการเชิงเส้น', summary: 'ทบทวนการย้ายข้างสมการ และทำแบบฝึกหัดท้ายบท 10 ข้อ', rating: '4', author: 'เจ้าของเว็บ', date: '2026-08-08' }
    ];

    const defaultHW = [
      { id: 1, subject: 'ภาษาอังกฤษ', title: 'แต่งประโยค Present Perfect 10 ข้อ', dueDate: '2026-08-12', status: 'ยังไม่ส่ง', author: 'เจ้าของเว็บ' }
    ];

    let users = JSON.parse(localStorage.getItem('users')) || defaultUsers;
    let logs = JSON.parse(localStorage.getItem('logs')) || defaultLogs;
    let homeworks = JSON.parse(localStorage.getItem('homeworks')) || defaultHW;
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let isRegisterMode = false;

    function saveState() {
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('logs', JSON.stringify(logs));
      localStorage.setItem('homeworks', JSON.stringify(homeworks));
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      render();
    }

    function render() {
      renderHeader();
      renderLogs();
      renderHomework();
      renderAdminTable();
    }

    function renderHeader() {
      const container = document.getElementById('userInfo');
      const adminTab = document.getElementById('tab-admin');
      const btnAddLog = document.getElementById('btnAddLog');
      const btnAddHW = document.getElementById('btnAddHW');

      // ตรวจสอบสิทธิ์ว่าเป็น Admin จริงหรือไม่จากอีเมลที่กำหนดไว้
      const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

      if (currentUser) {
        container.innerHTML = `
          <span class="text-slate-600 font-medium">👤 ${currentUser.name} ${isAdmin ? '<span class="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded">เจ้าของ</span>' : ''}</span>
          <button onclick="logout()" class="text-xs text-red-500 hover:underline">ออกจากระบบ</button>
        `;
        
        const canEdit = isAdmin || (currentUser.role === 'student' && currentUser.status === 'approved');
        btnAddLog.classList.toggle('hidden', !canEdit);
        btnAddHW.classList.toggle('hidden', !canEdit);
        adminTab.classList.toggle('hidden', !isAdmin);

        const pendingCount = users.filter(u => u.status === 'pending').length;
        const badge = document.getElementById('pendingBadge');
        if (pendingCount > 0) {
          badge.textContent = pendingCount;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }

      } else {
        container.innerHTML = `
          <button onclick="openAuthModal(false)" class="text-blue-600 font-medium hover:underline">เข้าสู่ระบบ / ลงชื่อ</button>
        `;
        btnAddLog.classList.add('hidden');
        btnAddHW.classList.add('hidden');
        adminTab.classList.add('hidden');
      }
    }

    function renderLogs() {
      const list = document.getElementById('logsList');
      if (logs.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm col-span-2 text-center py-8">ยังไม่มีบันทึกการเรียน</p>`;
        return;
      }
      list.innerHTML = logs.map(item => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow transition">
          <div class="flex justify-between items-start mb-2">
            <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-full font-medium">${item.subject}</span>
            <span class="text-xs text-slate-400">${item.date}</span>
          </div>
          <h3 class="font-semibold text-slate-800 text-base mb-1">${item.topic}</h3>
          <p class="text-slate-600 text-sm mb-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${item.summary}</p>
          <div class="flex justify-between items-center text-xs text-slate-500">
            <span>ระดับความเข้าใจ: ${'⭐'.repeat(Number(item.rating))}</span>
            <span>โดย: ${item.author}</span>
          </div>
        </div>
      `).join('');
    }

    function renderHomework() {
      const list = document.getElementById('homeworkList');
      if (homeworks.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm text-center py-8">ไม่มีรายการการบ้าน</p>`;
        return;
      }
      list.innerHTML = homeworks.map(item => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center space-x-2 mb-1">
              <span class="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded font-medium">${item.subject}</span>
              <span class="text-xs text-slate-400">กำหนดส่ง: ${item.dueDate}</span>
            </div>
            <h4 class="font-medium text-slate-800">${item.title}</h4>
            <p class="text-xs text-slate-400 mt-0.5">ผู้บันทึก: ${item.author}</p>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${item.status === 'ส่งแล้ว' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
              ${item.status}
            </span>
            ${(currentUser && (currentUser.email === ADMIN_EMAIL || currentUser.status === 'approved')) ? `
              <button onclick="toggleHWStatus(${item.id})" class="text-xs border px-2.5 py-1 rounded-lg hover:bg-slate-50">เปลี่ยนสถานะ</button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderAdminTable() {
      const tbody = document.getElementById('studentTable');
      tbody.innerHTML = users.filter(u => u.email !== ADMIN_EMAIL).map(student => `
        <tr>
          <td class="p-3 font-medium text-slate-800">${student.name}</td>
          <td class="p-3 text-slate-500">${student.email}</td>
          <td class="p-3">
            <span class="text-xs px-2 py-0.5 rounded-full ${student.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
              ${student.status === 'approved' ? 'อนุมัติแล้ว' : 'รอการอนุมัติ'}
            </span>
          </td>
          <td class="p-3 text-right space-x-2">
            ${student.status === 'pending' ? `
              <button onclick="approveStudent('${student.email}')" class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded hover:bg-emerald-700">อนุมัติ</button>
            ` : `
              <button onclick="revokeStudent('${student.email}')" class="bg-slate-200 text-slate-600 text-xs px-2.5 py-1 rounded hover:bg-slate-300">ยกเลิกสิทธิ์</button>
            `}
          </td>
        </tr>
      `).join('');
    }

    function openAuthModal(isReg = false) {
      isRegisterMode = isReg;
      document.getElementById('authTitle').textContent = isReg ? 'สมัครสมาชิกนักเรียน' : 'ลงชื่อเข้าใช้';
      document.getElementById('nameField').classList.toggle('hidden', !isReg);
      document.getElementById('authToggleBtn').textContent = isReg ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิกนักเรียน';
      openModal('modalAuth');
    }

    function toggleAuthMode() { openAuthModal(!isRegisterMode); }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPass').value;
      const name = document.getElementById('authName').value;

      if (isRegisterMode) {
        if (users.find(u => u.email === email)) {
          alert('อีเมลนี้ถูกใช้งานแล้ว');
          return;
        }
        // บังคับให้บัญชีที่สมัครใหม่ทุกคนได้รับบทบาท student และต้องรออนุมัติ
        const newUser = { 
          email, 
          pass, 
          name, 
          role: 'student', 
          status: (email === ADMIN_EMAIL) ? 'approved' : 'pending' 
        };
        users.push(newUser);
        alert('สมัครสมาชิกเรียบร้อยแล้ว!');
      } else {
        const found = users.find(u => u.email === email && u.pass === pass);
        if (!found) {
          alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
          return;
        }
        currentUser = found;
        if(found.email !== ADMIN_EMAIL && found.status === 'pending') {
          alert('บัญชีของคุณอยู่ระหว่างรอการอนุมัติจากเจ้าของเว็บ');
        }
      }
      closeModal('modalAuth');
      saveState();
    }

    function logout() { currentUser = null; saveState(); }

    function approveStudent(email) {
      const u = users.find(x => x.email === email);
      if (u) u.status = 'approved';
      saveState();
    }

    function revokeStudent(email) {
      const u = users.find(x => x.email === email);
      if (u) u.status = 'pending';
      saveState();
    }

    function saveLog(e) {
      e.preventDefault();
      logs.unshift({
        id: Date.now(),
        subject: document.getElementById('logSubject').value,
        topic: document.getElementById('logTopic').value,
        summary: document.getElementById('logSummary').value,
        rating: document.getElementById('logRating').value,
        author: currentUser.name,
        date: new Date().toISOString().split('T')[0]
      });
      closeModal('modalLog');
      saveState();
    }

    function saveHW(e) {
      e.preventDefault();
      homeworks.unshift({
        id: Date.now(),
        subject: document.getElementById('hwSubject').value,
        title: document.getElementById('hwTitle').value,
        dueDate: document.getElementById('hwDueDate').value,
        status: 'ยังไม่ส่ง',
        author: currentUser.name
      });
      closeModal('modalHW');
      saveState();
    }

    function toggleHWStatus(id) {
      const hw = homeworks.find(h => h.id === id);
      if (hw) {
        hw.status = hw.status === 'ส่งแล้ว' ? 'ยังไม่ส่ง' : 'ส่งแล้ว';
        saveState();
      }
    }

    function switchTab(tab) {
      ['logs', 'homework', 'admin'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}`);
        if(btn) btn.className = 'py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800';
      });

      document.getElementById(`section-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-3 border-b-2 border-blue-600 text-blue-600 font-semibold';
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    render();
  </script>
