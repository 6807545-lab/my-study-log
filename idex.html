<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บบันทึกการเรียนและการบ้าน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">📚</span>
        <h1 class="text-xl font-semibold text-slate-800">บันทึกการเรียน</h1>
      </div>
      <div id="userInfo" class="flex items-center space-x-3 text-sm">
        <!-- Auth status injected by JS -->
      </div>
    </div>
    <!-- Tabs navigation -->
    <div class="max-w-5xl mx-auto px-4 flex space-x-6 border-t border-slate-100 text-sm font-medium">
      <button onclick="switchTab('logs')" id="tab-logs" class="py-3 border-b-2 border-blue-600 text-blue-600 font-semibold">📖 บันทึกการเรียน</button>
      <button onclick="switchTab('homework')" id="tab-homework" class="py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800">📝 หมวดการบ้าน</button>
      <button onclick="switchTab('admin')" id="tab-admin" class="hidden py-3 border-b-2 border-transparent text-amber-600 hover:text-amber-800">⚙️ อนุมัตินักเรียน <span id="pendingBadge" class="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full hidden">0</span></button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- Tab 1: บันทึกการเรียน -->
    <section id="section-logs" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-700">รายการบันทึกการเรียนประจำวัน</h2>
        <button id="btnAddLog" onclick="openModal('modalLog')" class="hidden bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700 transition">+ เพิ่มบันทึกการเรียน</button>
      </div>
      <div id="logsList" class="grid gap-4 md:grid-cols-2">
        <!-- Log items rendered here -->
      </div>
    </section>

    <!-- Tab 2: หมวดการบ้าน -->
    <section id="section-homework" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-700">รายการการบ้านทั้งหมด</h2>
        <button id="btnAddHW" onclick="openModal('modalHW')" class="hidden bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700 transition">+ เพิ่มการบ้านใหม่</button>
      </div>
      <div id="homeworkList" class="space-y-3">
        <!-- Homework items rendered here -->
      </div>
    </section>

    <!-- Tab 3: จัดการอนุมัตินักเรียน (Admin Only) -->
    <section id="section-admin" class="hidden space-y-4">
      <h2 class="text-lg font-semibold text-slate-700">จัดการสิทธิ์นักเรียน</h2>
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-600 font-medium">
            <tr>
              <th class="p-3">ชื่อ-นามสกุล</th>
              <th class="p-3">อีเมล</th>
              <th class="p-3">สถานะ</th>
              <th class="p-3 text-right">การจัดการ</th>
            </tr>
          </thead>
          <tbody id="studentTable" class="divide-y divide-slate-100">
            <!-- Student rows rendered here -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Modals -->

  <!-- Modal Login / Register -->
  <div id="modalAuth" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 id="authTitle" class="font-semibold text-lg">ลงชื่อเข้าใช้</h3>
        <button onclick="closeModal('modalAuth')" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3">
        <div id="nameField" class="hidden">
          <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ-นามสกุล</label>
          <input type="text" id="authName" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">อีเมล</label>
          <input type="email" id="authEmail" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน</label>
          <input type="password" id="authPass" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white text-sm py-2 rounded-lg font-medium hover:bg-blue-700">ตกลง</button>
      </form>
      <div class="text-center text-xs text-slate-500">
        <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-blue-600 underline">ยังไม่มีบัญชี? สมัครสมาชิกนักเรียน</button>
      </div>
    </div>
  </div>

  <!-- Modal Add Log -->
  <div id="modalLog" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-lg">เพิ่มบันทึกการเรียน</h3>
        <button onclick="closeModal('modalLog')" class="text-slate-400">✕</button>
      </div>
      <form onsubmit="saveLog(event)" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">วิชา</label>
          <input type="text" id="logSubject" required placeholder="เช่น คณิตศาสตร์" class="w-full border rounded-lg p-2 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">หัวข้อที่เรียน</label>
          <input type="text" id="logTopic" required class="w-full border rounded-lg p-2 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">สรุปเนื้อหา</label>
          <textarea id="logSummary" rows="3" required class="w-full border rounded-lg p-2 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">ระดับความเข้าใจ (1-5)</label>
          <select id="logRating" class="w-full border rounded-lg p-2 outline-none">
            <option value="5">⭐⭐⭐⭐⭐ (เข้าใจดีมาก)</option>
            <option value="4">⭐⭐⭐⭐ (เข้าใจดี)</option>
            <option value="3">⭐⭐⭐ (ปานกลาง)</option>
            <option value="2">⭐⭐ (ต้องทบทวนเพิ่ม)</option>
            <option value="1">⭐ (ไม่เข้าใจ)</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium">บันทึกข้อมูล</button>
      </form>
    </div>
  </div>

  <!-- Modal Add Homework -->
  <div id="modalHW" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-lg">เพิ่มรายการการบ้าน</h3>
        <button onclick="closeModal('modalHW')" class="text-slate-400">✕</button>
      </div>
      <form onsubmit="saveHW(event)" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">วิชา</label>
          <input type="text" id="hwSubject" required placeholder="เช่น ภาษาอังกฤษ" class="w-full border rounded-lg p-2 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">หัวข้อการบ้าน</label>
          <input type="text" id="hwTitle" required class="w-full border rounded-lg p-2 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">กำหนดส่ง</label>
          <input type="date" id="hwDueDate" required class="w-full border rounded-lg p-2 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium">บันทึกการบ้าน</button>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // Initial Seed Data
    const defaultUsers = [
      { email: 'admin@test.com', pass: '1234', name: 'เจ้าของเว็บ (Admin)', role: 'admin', status: 'approved' },
      { email: 'student@test.com', pass: '1234', name: 'สมชาย เรียนดี', role: 'student', status: 'approved' },
      { email: 'pending@test.com', pass: '1234', name: 'สมหญิง ขยันเพียร', role: 'student', status: 'pending' }
    ];

    const defaultLogs = [
      { id: 1, subject: 'คณิตศาสตร์', topic: 'สมการเชิงเส้น', summary: 'ทบทวนการย้ายข้างสมการ และทำแบบฝึกหัดท้ายบท 10 ข้อ', rating: '4', author: 'สมชาย เรียนดี', date: '2026-08-08' }
    ];

    const defaultHW = [
      { id: 1, subject: 'ภาษาอังกฤษ', title: 'แต่งประโยค Present Perfect 10 ข้อ', dueDate: '2026-08-12', status: 'ยังไม่ส่ง', author: 'สมชาย เรียนดี' }
    ];

    // LocalStorage helper
    let users = JSON.parse(localStorage.getItem('users')) || defaultUsers;
    let logs = JSON.parse(localStorage.getItem('logs')) || defaultLogs;
    let homeworks = JSON.parse(localStorage.getItem('homeworks')) || defaultHW;
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let isRegisterMode = false;

    function saveState() {
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('logs', JSON.stringify(logs));
      localStorage.setItem('homeworks', JSON.stringify(homeworks));
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      render();
    }

    // App Initialization
    function render() {
      renderHeader();
      renderLogs();
      renderHomework();
      renderAdminTable();
    }

    function renderHeader() {
      const container = document.getElementById('userInfo');
      const adminTab = document.getElementById('tab-admin');
      const btnAddLog = document.getElementById('btnAddLog');
      const btnAddHW = document.getElementById('btnAddHW');

      if (currentUser) {
        container.innerHTML = `
          <span class="text-slate-600 font-medium">👤 ${currentUser.name} ${currentUser.role === 'admin' ? '<span class="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded">เจ้าของ</span>' : ''}</span>
          <button onclick="logout()" class="text-xs text-red-500 hover:underline">ออกจากระบบ</button>
        `;
        
        const canEdit = currentUser.role === 'admin' || (currentUser.role === 'student' && currentUser.status === 'approved');
        btnAddLog.classList.toggle('hidden', !canEdit);
        btnAddHW.classList.toggle('hidden', !canEdit);
        adminTab.classList.toggle('hidden', currentUser.role !== 'admin');

        // Badge notification for pending students
        const pendingCount = users.filter(u => u.status === 'pending').length;
        const badge = document.getElementById('pendingBadge');
        if (pendingCount > 0) {
          badge.textContent = pendingCount;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }

      } else {
        container.innerHTML = `
          <button onclick="openAuthModal(false)" class="text-blue-600 font-medium hover:underline">เข้าสู่ระบบ / ลงชื่อ</button>
        `;
        btnAddLog.classList.add('hidden');
        btnAddHW.classList.add('hidden');
        adminTab.classList.add('hidden');
      }
    }

    // Render Lists
    function renderLogs() {
      const list = document.getElementById('logsList');
      if (logs.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm col-span-2 text-center py-8">ยังไม่มีบันทึกการเรียน</p>`;
        return;
      }
      list.innerHTML = logs.map(item => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow transition">
          <div class="flex justify-between items-start mb-2">
            <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-full font-medium">${item.subject}</span>
            <span class="text-xs text-slate-400">${item.date}</span>
          </div>
          <h3 class="font-semibold text-slate-800 text-base mb-1">${item.topic}</h3>
          <p class="text-slate-600 text-sm mb-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${item.summary}</p>
          <div class="flex justify-between items-center text-xs text-slate-500">
            <span>ระดับความเข้าใจ: ${'⭐'.repeat(Number(item.rating))}</span>
            <span>โดย: ${item.author}</span>
          </div>
        </div>
      `).join('');
    }

    function renderHomework() {
      const list = document.getElementById('homeworkList');
      if (homeworks.length === 0) {
        list.innerHTML = `<p class="text-slate-400 text-sm text-center py-8">ไม่มีรายการการบ้าน</p>`;
        return;
      }
      list.innerHTML = homeworks.map(item => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center space-x-2 mb-1">
              <span class="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded font-medium">${item.subject}</span>
              <span class="text-xs text-slate-400">กำหนดส่ง: ${item.dueDate}</span>
            </div>
            <h4 class="font-medium text-slate-800">${item.title}</h4>
            <p class="text-xs text-slate-400 mt-0.5">ผู้บันทึก: ${item.author}</p>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${item.status === 'ส่งแล้ว' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
              ${item.status}
            </span>
            ${(currentUser && (currentUser.role === 'admin' || currentUser.status === 'approved')) ? `
              <button onclick="toggleHWStatus(${item.id})" class="text-xs border px-2.5 py-1 rounded-lg hover:bg-slate-50">เปลี่ยนสถานะ</button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderAdminTable() {
      const tbody = document.getElementById('studentTable');
      tbody.innerHTML = users.filter(u => u.role !== 'admin').map(student => `
        <tr>
          <td class="p-3 font-medium text-slate-800">${student.name}</td>
          <td class="p-3 text-slate-500">${student.email}</td>
          <td class="p-3">
            <span class="text-xs px-2 py-0.5 rounded-full ${student.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
              ${student.status === 'approved' ? 'อนุมัติแล้ว' : 'รอการอนุมัติ'}
            </span>
          </td>
          <td class="p-3 text-right space-x-2">
            ${student.status === 'pending' ? `
              <button onclick="approveStudent('${student.email}')" class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded hover:bg-emerald-700">อนุมัติ</button>
            ` : `
              <button onclick="revokeStudent('${student.email}')" class="bg-slate-200 text-slate-600 text-xs px-2.5 py-1 rounded hover:bg-slate-300">ยกเลิกสิทธิ์</button>
            `}
          </td>
        </tr>
      `).join('');
    }

    // Auth Handlers
    function openAuthModal(isReg = false) {
      isRegisterMode = isReg;
      document.getElementById('authTitle').textContent = isReg ? 'สมัครสมาชิกนักเรียน' : 'ลงชื่อเข้าใช้';
      document.getElementById('nameField').classList.toggle('hidden', !isReg);
      document.getElementById('authToggleBtn').textContent = isReg ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิกนักเรียน';
      openModal('modalAuth');
    }

    function toggleAuthMode() {
      openAuthModal(!isRegisterMode);
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPass').value;
      const name = document.getElementById('authName').value;

      if (isRegisterMode) {
        if (users.find(u => u.email === email)) {
          alert('อีเมลนี้ถูกใช้งานแล้ว');
          return;
        }
        const newUser = { email, pass, name, role: 'student', status: 'pending' };
        users.push(newUser);
        alert('สมัครสมาชิกเรียบร้อยแล้ว! โปรดแจ้งเจ้าของเว็บเพื่อกดอนุมัติสิทธิ์ใช้งาน');
      } else {
        const found = users.find(u => u.email === email && u.pass === pass);
        if (!found) {
          alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
          return;
        }
        currentUser = found;
        if(found.status === 'pending') {
          alert('บัญชีของคุณอยู่ระหว่างรอการอนุมัติจากเจ้าของเว็บ คุณจะดูข้อมูลได้อย่างเดียวในตอนนี้');
        }
      }
      closeModal('modalAuth');
      saveState();
    }

    function logout() {
      currentUser = null;
      saveState();
    }

    function approveStudent(email) {
      const u = users.find(x => x.email === email);
      if (u) u.status = 'approved';
      saveState();
    }

    function revokeStudent(email) {
      const u = users.find(x => x.email === email);
      if (u) u.status = 'pending';
      saveState();
    }

    // Actions
    function saveLog(e) {
      e.preventDefault();
      logs.unshift({
        id: Date.now(),
        subject: document.getElementById('logSubject').value,
        topic: document.getElementById('logTopic').value,
        summary: document.getElementById('logSummary').value,
        rating: document.getElementById('logRating').value,
        author: currentUser.name,
        date: new Date().toISOString().split('T')[0]
      });
      closeModal('modalLog');
      saveState();
    }

    function saveHW(e) {
      e.preventDefault();
      homeworks.unshift({
        id: Date.now(),
        subject: document.getElementById('hwSubject').value,
        title: document.getElementById('hwTitle').value,
        dueDate: document.getElementById('hwDueDate').value,
        status: 'ยังไม่ส่ง',
        author: currentUser.name
      });
      closeModal('modalHW');
      saveState();
    }

    function toggleHWStatus(id) {
      const hw = homeworks.find(h => h.id === id);
      if (hw) {
        hw.status = hw.status === 'ส่งแล้ว' ? 'ยังไม่ส่ง' : 'ส่งแล้ว';
        saveState();
      }
    }

    // Tab Navigation
    function switchTab(tab) {
      ['logs', 'homework', 'admin'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}`);
        if(btn) btn.className = 'py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800';
      });

      document.getElementById(`section-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-3 border-b-2 border-blue-600 text-blue-600 font-semibold';
    }

    // Helpers
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // First load execution
    render();
  </script>
</body>
</html>
